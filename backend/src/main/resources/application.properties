server.port=${PORT:8080}
spring.application.name=ivy-audit-backend

# Ivy API Configuration (supplied via environment variables)
ivy.api.base-url=${IVY_BASE_URL:https://solve.ivy.homes}
ivy.api.key=${IVY_API_KEY:}
ivy.api.email=${IVY_DEMO_EMAIL:demo1@ivy.homes}
ivy.api.password=${IVY_DEMO_PASSWORD:}

# Submission Output Path
submission.output.path=${SUBMISSION_PATH:../submission.json}

# Logging
logging.level.com.ivy.assignment=INFO
